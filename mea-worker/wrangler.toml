name = "mea-worker"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Workers AI — no API key; the free plan includes a daily allowance
[ai]
binding = "AI"

# Counters for the per-IP and site-wide limits (SQLite-backed Durable Object — available on the free plan)
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "IpLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IpLimiter"]

[vars]
ALLOWED_ORIGINS = "https://iamigoi.github.io"
MODEL = "@cf/meta/llama-3.1-8b-instruct"
BURST_PER_MIN = "4"        # questions per IP per minute
DAILY_PER_IP = "15"        # questions per IP per UTC day
GLOBAL_DAILY = "120"       # questions for the whole site per UTC day — keeps you inside the free AI allowance
MAX_TOKENS = "380"
# IP_SALT: set it as a secret:  npx wrangler secret put IP_SALT
